<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Konnections IMAG — decor SVG preview</title>
<style>
  body { font-family: ui-sans-serif, system-ui, sans-serif; background: #fff; color: #172a35; margin: 3rem; }
  h1 { font-size: 1.25rem; letter-spacing: 0.02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2rem; margin-top: 2rem; }
  figure { margin: 0; border: 1px solid #e3eaec; border-radius: 12px; padding: 1.5rem; }
  figure.dark { background: #14303f; }
  img { width: 100%; height: 180px; object-fit: contain; }
  figcaption { margin-top: 0.75rem; font-size: 0.8rem; color: #4c5e69; letter-spacing: 0.04em; }
  .dark figcaption { color: #cfdbe2; }
</style>
</head>
<body>
<h1>Decor SVGs — brand shades, logo-derived shapes</h1>
<div class="grid">
  <figure><img src="bg-contours.svg" alt=""><figcaption>bg-contours.svg (abstract bg)</figcaption></figure>
  <figure><img src="bg-orbit-field.svg" alt=""><figcaption>bg-orbit-field.svg (abstract bg)</figcaption></figure>
  <figure><img src="bg-drift.svg" alt=""><figcaption>bg-drift.svg (abstract bg)</figcaption></figure>
  <figure><img src="bg-lattice.svg" alt=""><figcaption>bg-lattice.svg (abstract bg)</figcaption></figure>
  <figure><img src="swoosh-rose.svg" alt=""><figcaption>swoosh-rose.svg</figcaption></figure>
  <figure><img src="swoosh-teal.svg" alt=""><figcaption>swoosh-teal.svg</figcaption></figure>
  <figure><img src="swoosh-blue.svg" alt=""><figcaption>swoosh-blue.svg</figcaption></figure>
  <figure><img src="tri-orbits.svg" alt=""><figcaption>tri-orbits.svg</figcaption></figure>
  <figure><img src="ring-trio.svg" alt=""><figcaption>ring-trio.svg</figcaption></figure>
  <figure><img src="arc-stack.svg" alt=""><figcaption>arc-stack.svg</figcaption></figure>
  <figure><img src="dot-triangle.svg" alt=""><figcaption>dot-triangle.svg</figcaption></figure>
  <figure><img src="petal-fan.svg" alt=""><figcaption>petal-fan.svg</figcaption></figure>
  <figure><img src="divider-spark.svg" alt=""><figcaption>divider-spark.svg</figcaption></figure>
  <figure><img src="underline-rose.svg" alt=""><figcaption>underline-rose.svg</figcaption></figure>
  <figure><img src="wave-lines.svg" alt=""><figcaption>wave-lines.svg</figcaption></figure>
  <figure><img src="quote-swoosh.svg" alt=""><figcaption>quote-swoosh.svg</figcaption></figure>
</div>
</body>
</html>
